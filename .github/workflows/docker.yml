name: Docker

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
      channel:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Tag SemVer imutável existente, sem o prefixo v
        required: true
        type: string
      ref:
        description: Tag Git existente ou SHA completo do commit
        required: true
        type: string
      channel:
        description: Canal Docker
        required: true
        type: choice
        options: [beta, stable]

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validar os parâmetros
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          [[ "$CHANNEL" = beta || "$CHANNEL" = stable ]]
          if [[ "$CHANNEL" = beta ]]; then [[ "$VERSION" == *-beta.* ]]; else [[ "$VERSION" != *-* ]]; fi
      - name: Baixar o código-fonte da versão
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Configurar o QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Configurar o Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Autenticar no Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Montar as tags Docker
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nfe-mock
        run: |
          revision="$(git rev-parse --short=7 HEAD)"
          major="${VERSION%%.*}"
          remainder="${VERSION#*.}"
          minor="${remainder%%.*}"
          {
            echo 'value<<EOF'
            echo "$IMAGE:$VERSION"
            if [[ "$CHANNEL" = beta ]]; then
              echo "$IMAGE:beta"
              echo "$IMAGE:developer"
            else
              echo "$IMAGE:$major.$minor"
              echo "$IMAGE:$major"
              echo "$IMAGE:latest"
            fi
            echo "$IMAGE:sha-$revision"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Construir e publicar a imagem multi-arquitetura
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
            APP_COMMIT=${{ steps.tags.outputs.revision }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=NF-e Mock
            org.opencontainers.image.description=Gerador local de NF-e para desenvolvimento, QA e testes de integração
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
